# Deployed with 0 replicas, so it's off until you switch it on with ./memory-leak/oom-crashloop.sh on or the
# scenario control panel, which scale it to 1.
# The container allocates memory it never frees until it exceeds its 96Mi limit and is OOMKilled.
# Kubernetes restarts it, it leaks again, and the restarts back off into CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-leak
  namespace: otel-workshop
  labels:
    app.kubernetes.io/name: memory-leak
    app.kubernetes.io/part-of: otel-workshop
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-leak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-leak
        app.kubernetes.io/part-of: otel-workshop
    spec:
      containers:
        - name: leaker
          image: python:3.13-slim-bookworm
          command: ["python", "-u", "-c"]
          args:
            - |
              import json, time
              MIB = 1024 * 1024
              leaked = []
              while True:
                  # Non-zero bytes so the pages are really committed, not lazily mapped.
                  leaked.append(b"\x01" * (2 * MIB))
                  print(json.dumps({"level": "INFO", "service": "memory-leak", "message": "cached another batch", "leaked_mib": 2 * len(leaked)}))
                  time.sleep(1)
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
