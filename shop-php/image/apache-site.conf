<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # No access log: the app writes its own JSON logs, and Apache's text access log would add noise.
    ErrorLog /proc/self/fd/2
</VirtualHost>
