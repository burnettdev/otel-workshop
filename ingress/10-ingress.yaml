# Exposes the storefront at / and the scenario control panel at /flags through the cluster's Traefik ingress.
# Before applying:
#  - replace shop.example.com with your hostname and point DNS for it at the ingress controller, and
#  - replace traefik with your ingress class if needed.
# There's no secretName: Traefik serves its default certificate, which works if that's a wildcard covering the
# host. Otherwise create a TLS secret in otel-workshop and add `secretName: <name>` under tls.
# Serve it over HTTPS: browsers only treat http://localhost as a secure context, not plain-HTTP hostnames.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-workshop
  namespace: otel-workshop
  labels:
    app.kubernetes.io/part-of: otel-workshop
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shop.example.com]
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: scenario-control
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-web
                port:
                  name: http
