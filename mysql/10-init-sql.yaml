  # Discount codes for checkout (scenario 11). percent_off is unique among active codes, so "the best discount" has
  # one answer whichever way it's looked up.
  03-discounts.sql: |
    CREATE TABLE discounts (
      code               VARCHAR(32) PRIMARY KEY,
      description        VARCHAR(100) NOT NULL,
      percent_off        INT NOT NULL,
      min_subtotal_cents INT NOT NULL,
      active             TINYINT(1) NOT NULL
    );
