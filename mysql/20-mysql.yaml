apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: otel-workshop
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: otel-workshop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: otel-workshop
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: shop
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql, key: root-password }
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: mysql, key: user }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql, key: password }
          # TCP only answers after the init scripts have finished (the init server uses the socket only).
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -h127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" -e 'SELECT 1' shop"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        # Ephemeral on purpose: a pod restart gives a freshly seeded database.
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: otel-workshop
  labels:
    app.kubernetes.io/name: mysql
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
