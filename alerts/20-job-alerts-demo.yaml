# Workshop variant of JobPodPending with a 1-minute grace period, so it fires live a minute or two after
# ./uploads-sync/trigger-incident.sh. Delete this file's resource after the workshop:
#   kubectl delete -f alerts/20-job-alerts-demo.yaml
# There's no short variant of CronJobRunNotCompleted: a healthy uploads-sync run takes ~90 s, so a 1-minute
# threshold would fire on every normal run.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-workshop-jobs-demo
  namespace: otel-workshop
  labels:
    app.kubernetes.io/part-of: otel-workshop
spec:
  groups:
    - name: otel-workshop jobs (demo)
      interval: 1m
      rules:
        - alert: JobPodPending
          expr: |
            max by (k8s_namespace_name, k8s_job_name, k8s_pod_name) (
              {otel_metric_name="k8s.pod.phase", otel_metric_type="gauge", k8s_namespace_name="otel-workshop", k8s_job_name!=""}
            ) == 1
          for: 1m
          labels:
            env: prod
          annotations:
            summary: "[demo] Job pod {{ $labels.k8s_pod_name }} has been Pending for more than 1 minute"
            description: >-
              Pod {{ $labels.k8s_pod_name }} of Job {{ $labels.k8s_job_name }} in {{ $labels.k8s_namespace_name }}
              can't start. Check its events for FailedScheduling or FailedAttachVolume.
