# Check rules for the slow-checkout (README scenario 6), OOMKilled crash-loop (scenario 7) and failing-payments
# (scenario 8) scenarios.
# Same naming conventions as 10-job-alerts.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-workshop-services
  namespace: otel-workshop
  labels:
    app.kubernetes.io/part-of: otel-workshop
spec:
  groups:
    - name: otel-workshop services
      interval: 1m
      rules:
        # dash0.spans.duration is Dash0's span-duration histogram, computed from ingested spans, so span and resource
        # attributes are available as labels. Normal checkout p95 is about 0.4 s; with ./shop-php/slow-checkout.sh on
        # it's about 2.1 s. GET /slow is excluded by the span-name match: it's slow on purpose.
        - alert: CheckoutLatencyHigh
          expr: |
            histogram_quantile(0.95, sum by (service_namespace, service_name, otel_span_name) (rate(
              {otel_metric_name="dash0.spans.duration", service_namespace="otel-workshop", service_name="shop-php", otel_span_kind="SERVER", otel_span_name=~"(GET|POST) /checkout"}[2m]
            ))) > 1
          for: 1m
          labels:
            env: prod
          annotations:
            summary: "{{ $labels.otel_span_name }} on {{ $labels.service_name }} has a p95 latency above 1 s"
            description: >-
              p95 latency of {{ $labels.otel_span_name }} on {{ $labels.service_name }} is {{ $value }} s (normally
              under 0.5 s). Open a slow checkout trace and look under the shipping.quote span for slow database queries.

        # dash0.spans counts spans, with the span status as otel_span_status_code. Normally no payment fails; with
        # ./payment-java/payment-failures.sh on, about 30% do. The numerator is empty while nothing fails, so the
        # rule has no result at all rather than a 0.
        - alert: PaymentErrorRateHigh
          expr: |
            sum by (service_namespace, service_name, otel_span_name) (rate(
              {otel_metric_name="dash0.spans", service_namespace="otel-workshop", service_name="payment-java", otel_span_kind="SERVER", otel_span_name="POST /payments", otel_span_status_code="ERROR"}[2m]
            ))
            /
            sum by (service_namespace, service_name, otel_span_name) (rate(
              {otel_metric_name="dash0.spans", service_namespace="otel-workshop", service_name="payment-java", otel_span_kind="SERVER", otel_span_name="POST /payments"}[2m]
            ))
            > 0.1
          for: 1m
          labels:
            env: prod
          annotations:
            summary: "{{ $value | humanizePercentage }} of payments on {{ $labels.service_name }} are failing"
            description: >-
              More than 10% of {{ $labels.otel_span_name }} requests on {{ $labels.service_name }} have ended in an
              error over the last 2 minutes (normally none). Checkouts fail with "payment failed". Open a failing
              trace and look at the error on the payment-java span and its log.

        # k8s.container.status.reason is 1 for the reason a container is currently waiting or terminated with.
        # OOMKilled itself only lasts the moment between the kill and the restart, too short for the 30-second
        # metric collection to catch reliably, so this matches the CrashLoopBackOff that follows repeated kills.
        # max_over_time keeps the alert firing between back-offs instead of flapping.
        - alert: ContainerCrashLooping
          expr: |
            max by (k8s_namespace_name, k8s_pod_name, k8s_container_name) (max_over_time(
              {otel_metric_name="k8s.container.status.reason", k8s_namespace_name="otel-workshop", k8s_container_status_reason="CrashLoopBackOff"}[5m]
            )) == 1
          for: 1m
          labels:
            env: prod
          annotations:
            summary: "Container {{ $labels.k8s_container_name }} in pod {{ $labels.k8s_pod_name }} is crash looping"
            description: >-
              Container {{ $labels.k8s_container_name }} of pod {{ $labels.k8s_pod_name }} in {{ $labels.k8s_namespace_name }}
              keeps exiting and Kubernetes is backing off its restarts. Check its last termination reason (OOMKilled
              means it hit its memory limit) and its BackOff events and logs.
