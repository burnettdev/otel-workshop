# Dash0 auth token for the browser SDK. Use an ingest-only token: it is visible to anyone who loads the page.
# Rather than editing this file (and risking committing the token), you can create the Secret directly:
#   kubectl create secret generic shop-web-dash0 -n otel-workshop \
#     --from-literal=DASH0_AUTH_TOKEN=auth_xxx --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: shop-web-dash0
  namespace: otel-workshop
type: Opaque
stringData:
  DASH0_AUTH_TOKEN: REPLACE_WITH_INGEST_ONLY_TOKEN
