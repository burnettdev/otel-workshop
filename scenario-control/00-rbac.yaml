# What scenario-control may change: exactly the objects the scenario scripts change, all in otel-workshop.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scenario-control
  namespace: otel-workshop
  labels:
    app.kubernetes.io/name: scenario-control
    app.kubernetes.io/part-of: otel-workshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scenario-control
  namespace: otel-workshop
  labels:
    app.kubernetes.io/name: scenario-control
    app.kubernetes.io/part-of: otel-workshop
rules:
  # Slow checkout and failing payments: set the flag.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [shop-php-flags, payment-java-flags]
    verbs: [get, patch]
  # Restart the services that read the flags, scale memory-leak and academy-site.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [shop-php, payment-java, memory-leak, academy-site]
    verbs: [get, patch]
  # Stuck sync job: start a run from the CronJob, find it, and wait for it to finish.
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [uploads-sync]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scenario-control
  namespace: otel-workshop
  labels:
    app.kubernetes.io/name: scenario-control
    app.kubernetes.io/part-of: otel-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scenario-control
subjects:
  - kind: ServiceAccount
    name: scenario-control
    namespace: otel-workshop
