# Static checks for every pull request: manifests, alert rules, scripts, Python, and the images.
# They don't need a cluster or registry. Deploying and the Dash0-side behaviour still need testing on a cluster.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Core resources against the Kubernetes schemas, PrometheusRule against the community CRD catalog.
      # The Dash0 CRDs (Dash0Monitoring, Dash0SyntheticCheck, Dash0OperatorConfiguration) have no published
      # schema, so they're reported as skipped.
      - name: kubeconform
        run: |
          find . -name '*.yaml' -not -path '*/image/*' -not -path './.git/*' -not -path './.github/*' -print0 \
            | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -verbose -ignore-missing-schemas -kubernetes-version 1.33.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A PrometheusRule's spec is a Prometheus rule file, so promtool can check the PromQL and rule structure.
      - name: promtool check rules
        run: |
          mkdir -p /tmp/rules
          for f in alerts/*.yaml; do yq '.spec' "$f" > "/tmp/rules/$(basename "$f")"; done
          # The glob is expanded here, on the runner: docker passes arguments to promtool without a shell.
          cd /tmp/rules
          docker run --rm -v /tmp/rules:/rules --entrypoint promtool prom/prometheus:v3.5.0 check rules $(printf '/rules/%s ' *.yaml)

  scripts:
    name: Scripts and Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
      - name: python compile
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile

  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [shop-php, pricing-py, recommendations-node, inventory-go, payment-java, shop-web, scenario-control]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}/image
          platforms: linux/amd64
          push: false
          build-args: |
            VCS_REVISION=${{ github.sha }}
            VCS_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
